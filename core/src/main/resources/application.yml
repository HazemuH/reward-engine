spring:
  application:
    name: reward-core
  datasource:
    # No defaults: the app must fail to start rather than run on a guessed credential.
    # Local values live in application-local.yml.
    url: ${REWARD_DB_URL}
    username: ${REWARD_DB_USERNAME}
    password: ${REWARD_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REWARD_REDIS_HOST:localhost}
      port: ${REWARD_REDIS_PORT:6379}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Engine-wide defaults. Per-tenant values (time zone for counter periods,
# currency) live on the tenant row; anything else a tenant may want to
# override belongs here rather than hardcoded in Java.
reward:
  quote-ttl-minutes: 15
  calculate-rate-limit-per-minute: 10

logging:
  level:
    com.rewardengine: INFO
