spring:
  application:
    name: reward-core
  datasource:
    url: jdbc:postgresql://localhost:5433/reward
    username: reward
    password: reward
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6380

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Reward-engine specific settings. Anything a tenant can plausibly want to
# override belongs under here, not hardcoded in Java — this is what keeps
# the base adjustable per deployment instead of forked per client.
reward:
  period-zone: UTC # overridden per deployment, e.g. Asia/Jakarta for tenant
  quote-ttl-minutes: 15
  calculate-rate-limit-per-minute: 10

logging:
  level:
    com.rewardengine: INFO
